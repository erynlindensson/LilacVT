[package]
name = "gd-global-input"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Global (unfocused) keyboard state polling for Godot, for LilacVT hotkeys."

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = "0.5.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
